<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Четыре этапа</title>
    <style>
        :root {
            --deep-blue: #1a3a6b;
            --main-blue: #2c5aa0;
            --light-blue: #5b8dd9;
            --pale-blue: #a8c5e8;
            --ice-blue: #e6f0fa;
            --white: #ffffff;
            --correct: #2e7d5b;
            --incorrect: #b83a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        .widget {
            width: 600px;
            height: 600px;
            background: var(--white);
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Пул действий */
        .actions-pool {
            background: var(--ice-blue);
            border: 1.5px dashed var(--light-blue);
            border-radius: 8px;
            padding: 8px;
            min-height: 96px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-content: flex-start;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .actions-pool.drag-over {
            background: #d5e6f8;
            border-color: var(--main-blue);
        }

        .action-item {
            background: var(--main-blue);
            color: var(--white);
            padding: 5px 10px;
            border-radius: 13px;
            cursor: grab;
            user-select: none;
            font-size: 0.65rem;
            line-height: 1.2;
            box-shadow: 0 1px 3px rgba(26, 58, 107, 0.25);
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
            text-align: center;
            max-width: 150px;
            font-weight: 500;
        }

        .action-item:hover {
            background: var(--light-blue);
            transform: translateY(-1px);
            box-shadow: 0 3px 6px rgba(26, 58, 107, 0.3);
        }

        .action-item:active {
            cursor: grabbing;
        }

        .action-item.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }

        /* Сетка этапов — 2x2 */
        .stages-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            flex-grow: 1;
            min-height: 0;
            margin-bottom: 12px;
        }

        .stage {
            background: var(--white);
            border: 1.5px solid var(--pale-blue);
            border-radius: 8px;
            padding: 7px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            transition: border-color 0.2s, background 0.2s;
            overflow: hidden;
        }

        .stage.drag-over {
            background: var(--ice-blue);
            border-color: var(--main-blue);
        }

        .stage h2 {
            font-size: 0.7rem;
            color: var(--deep-blue);
            text-align: center;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--pale-blue);
            font-weight: 700;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        .stage-dropzone {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            padding: 1px;
            min-height: 0;
        }

        .stage-dropzone::-webkit-scrollbar {
            width: 4px;
        }
        .stage-dropzone::-webkit-scrollbar-thumb {
            background: var(--pale-blue);
            border-radius: 2px;
        }

        .stage-dropzone .action-item {
            background: var(--ice-blue);
            color: var(--deep-blue);
            border: 1px solid var(--pale-blue);
            box-shadow: none;
            font-size: 0.62rem;
            padding: 4px 7px;
            max-width: 100%;
        }

        .stage-dropzone .action-item:hover {
            background: var(--pale-blue);
            color: var(--white);
        }

        /* Кнопки */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        button {
            padding: 8px 26px;
            border: none;
            border-radius: 18px;
            font-size: 0.78rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            letter-spacing: 0.3px;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-check {
            background: var(--main-blue);
            color: var(--white);
            box-shadow: 0 2px 6px rgba(44, 90, 160, 0.35);
        }

        .btn-check:hover {
            background: var(--deep-blue);
            box-shadow: 0 3px 8px rgba(26, 58, 107, 0.4);
        }

        .btn-reset {
            background: var(--white);
            color: var(--main-blue);
            border: 1.5px solid var(--main-blue);
        }

        .btn-reset:hover {
            background: var(--ice-blue);
        }

        /* Сообщение */
        .result-message {
            text-align: center;
            font-size: 0.78rem;
            font-weight: 600;
            min-height: 18px;
            flex-shrink: 0;
            color: var(--main-blue);
        }

        .correct {
            color: var(--correct);
        }

        .incorrect {
            color: var(--incorrect);
        }

        /* Подсветка результатов */
        .stage.correct-zone {
            border-color: var(--correct);
            background: #eaf5f0;
        }

        .stage.incorrect-zone {
            border-color: var(--incorrect);
            background: #fbeeee;
        }

        .action-item.correct-item {
            background: var(--correct) !important;
            color: var(--white) !important;
            border-color: var(--correct) !important;
        }

        .action-item.incorrect-item {
            background: var(--incorrect) !important;
            color: var(--white) !important;
            border-color: var(--incorrect) !important;
        }
    </style>
</head>
<body>

<div class="widget">
    <div class="actions-pool" id="actionsPool"></div>

    <div class="stages-grid" id="stagesGrid">
        <div class="stage" data-stage="1">
            <h2>1. Подготовительный</h2>
            <div class="stage-dropzone" id="stage1"></div>
        </div>
        <div class="stage" data-stage="2">
            <h2>2. Оповещение и сбор</h2>
            <div class="stage-dropzone" id="stage2"></div>
        </div>
        <div class="stage" data-stage="3">
            <h2>3. Практические действия</h2>
            <div class="stage-dropzone" id="stage3"></div>
        </div>
        <div class="stage" data-stage="4">
            <h2>4. Заключительный</h2>
            <div class="stage-dropzone" id="stage4"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-check" id="checkBtn">Проверить</button>
        <button class="btn-reset" id="resetBtn">Сбросить</button>
    </div>

    <div class="result-message" id="resultMessage"></div>
</div>

<script>
    const actionsData = [
        { id: 'a1', text: 'Проведение целевых инструктажей', correctStage: 1 },
        { id: 'a2', text: 'Оповещение об условном разливе', correctStage: 2 },
        { id: 'a3', text: 'Разведка места разлива', correctStage: 3 },
        { id: 'a4', text: 'Подведение итогов и голосование комиссии', correctStage: 4 },
        { id: 'a5', text: 'Организация взаимодействия с органами управления', correctStage: 2 },
        { id: 'a6', text: 'Ликвидация разлива с использованием средств сбора нефти', correctStage: 3 },
        { id: 'a7', text: 'Ознакомление с объектом', correctStage: 1 },
        { id: 'a8', text: 'Оформление документации', correctStage: 4 }
    ];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    let shuffledActions = shuffleArray([...actionsData]);

    const actionsPool = document.getElementById('actionsPool');
    const stage1 = document.getElementById('stage1');
    const stage2 = document.getElementById('stage2');
    const stage3 = document.getElementById('stage3');
    const stage4 = document.getElementById('stage4');
    const stages = [stage1, stage2, stage3, stage4];
    const checkBtn = document.getElementById('checkBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultMessage = document.getElementById('resultMessage');

    function createActionElement(action) {
        const div = document.createElement('div');
        div.className = 'action-item';
        div.draggable = true;
        div.id = action.id;
        div.textContent = action.text;
        div.dataset.correctStage = action.correctStage;
        div.addEventListener('dragstart', handleDragStart);
        div.addEventListener('dragend', handleDragEnd);
        return div;
    }

    function init() {
        actionsPool.innerHTML = '';
        stages.forEach(stage => stage.innerHTML = '');
        shuffledActions.forEach(action => {
            actionsPool.appendChild(createActionElement(action));
        });
        document.querySelectorAll('.stage').forEach(s => {
            s.classList.remove('correct-zone', 'incorrect-zone');
        });
        resultMessage.textContent = '';
        resultMessage.className = 'result-message';
    }

    let draggedItem = null;

    function handleDragStart(e) {
        draggedItem = this;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', this.id);
    }

    function handleDragEnd() {
        this.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        draggedItem = null;
    }

    function setupDropZones() {
        const dropZones = [actionsPool, ...stages];

        dropZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                zone.classList.add('drag-over');
            });

            zone.addEventListener('dragleave', (e) => {
                if (!zone.contains(e.relatedTarget)) {
                    zone.classList.remove('drag-over');
                }
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                if (!draggedItem) return;

                let container = zone;
                if (zone.classList.contains('stage')) {
                    container = zone.querySelector('.stage-dropzone');
                }

                if (container !== draggedItem.parentNode) {
                    container.appendChild(draggedItem);
                }
            });
        });
    }

    function checkResults() {
        let correctCount = 0;
        const totalItems = actionsData.length;

        document.querySelectorAll('.stage').forEach(s => {
            s.classList.remove('correct-zone', 'incorrect-zone');
        });
        document.querySelectorAll('.action-item').forEach(item => {
            item.classList.remove('correct-item', 'incorrect-item');
        });

        stages.forEach((stageZone, index) => {
            const stageNumber = index + 1;
            const items = stageZone.querySelectorAll('.action-item');
            let allCorrect = true;
            let hasItems = items.length > 0;

            items.forEach(item => {
                if (parseInt(item.dataset.correctStage) === stageNumber) {
                    item.classList.add('correct-item');
                    correctCount++;
                } else {
                    item.classList.add('incorrect-item');
                    allCorrect = false;
                }
            });

            if (hasItems) {
                stageZone.closest('.stage').classList.add(allCorrect ? 'correct-zone' : 'incorrect-zone');
            }
        });

        const poolItems = actionsPool.querySelectorAll('.action-item');
        poolItems.forEach(item => item.classList.add('incorrect-item'));

        if (correctCount === totalItems && poolItems.length === 0) {
            resultMessage.textContent = '✓ Отлично! Все действия распределены верно!';
            resultMessage.className = 'result-message correct';
        } else {
            resultMessage.textContent = `Правильно: ${correctCount} из ${totalItems}. Попробуйте ещё раз.`;
            resultMessage.className = 'result-message incorrect';
        }
    }

    function resetTask() {
        shuffledActions = shuffleArray([...actionsData]);
        init();
    }

    document.addEventListener('DOMContentLoaded', () => {
        init();
        setupDropZones();
        checkBtn.addEventListener('click', checkResults);
        resetBtn.addEventListener('click', resetTask);
    });

    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());
</script>

</body>
</html>
